name: Publish Webtest 34 Learning frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - term-tests/**
      - tests/**
      - .nojekyll
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - scripts/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:check
      - run: npm test
      # Artifact là thư mục _site (không phải `.`): loại node_modules và nguồn .ts, giữ .js đã commit.
      - run: npm run stage:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
